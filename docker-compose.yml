version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poor-sofascore-app
    ports:
      - "3000:3000"
    environment:
      - SERVER_PORT=3000
    networks:
      - sofascore-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "wget -qO- http://localhost:3000/index.html || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2. Nginx reverse proxy — imagem oficial do Docker Hub
  proxy:
    image: nginx:alpine
    container_name: poor-sofascore-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - sofascore-network

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: sofascore-monitor
    depends_on:
      - app
    networks:
      - sofascore-network

  # 4. Jenkins CI/CD — construido a partir do Dockerfile.jenkins local
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: poor-sofascore-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sofascore-network

  cache:
    image: redis:7-alpine
    container_name: poor-sofascore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sofascore-network

volumes:
  jenkins-data:
    name: poor-sofascore-jenkins-data
  nginx-logs:
    name: poor-sofascore-nginx-logs

networks:
  sofascore-network:
    driver: bridge